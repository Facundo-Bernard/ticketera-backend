name: Deploy Ticketera Backend

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: 📥 Clonar código del repositorio
        uses: actions/checkout@v4
        with:
          clean: false

      - name: ⚙️ Asegurar archivo .env desde el servidor
        run: |
          if [ ! -f .env ] && [ -f /home/serverportable/Documentos/Ticketera/ticketera-backend/.env ]; then
            cp /home/serverportable/Documentos/Ticketera/ticketera-backend/.env .env
          fi

      - name: 🚀 Rebuild y Despliegue de Backend FastAPI
        run: |
          docker compose up -d --build --remove-orphans
