services:
  # Backend FastAPI (Python)
  backend:
    build: .
    container_name: ticketcoopya-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env                              # Carga automática de todas las variables de entorno
    environment:
      - PORT=8085
    networks:
      - web_net                              # Comunicación local
      - asistodo_shared_net                  # Comunicación con ambos Caddys de frontends
      - red-mongo-compartida                 # Conexión aislada a MongoDB en contenedor independiente
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 768M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  web_net:
    driver: bridge
  asistodo_shared_net:
    name: asistodo_shared_net
    external: true                           # Red Docker externa compartida con asistodoweb
  red-mongo-compartida:
    name: red-mongo-compartida
    external: true                           # Red Docker externa compartida para base de datos MongoDB
